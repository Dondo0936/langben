# Default console image: overlay applied (Kênh, Lộ trình, Hội thoại, Vết mark).
# Built from .build/langfuse after scripts/apply-langfuse-overlay.sh (see scripts/up.sh).
# Iframe origin for Kênh / Lộ trình. This is the URL the browser loads, not the
# Zalo webhook tunnel (VET_PUBLIC_URL). Keep it loopback for local compose.
services:
  langfuse-web:
    image: vet-console:local
    build:
      context: .build/langfuse
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_VET_MARKETING_URL: ${NEXT_PUBLIC_VET_MARKETING_URL:-http://localhost:43173}
    environment:
      NEXT_PUBLIC_VET_MARKETING_URL: ${NEXT_PUBLIC_VET_MARKETING_URL:-http://localhost:43173}
      LANGFUSE_MIGRATION_V4_WRITE_MODE: ${LANGFUSE_MIGRATION_V4_WRITE_MODE:-dual}
